[project]
name = "moneymatters"
version = "0.1.0"
description = "MoneyMatters — personal budgeting web application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "django-environ>=0.11",
    "django-allauth>=65.0",
    "django-htmx>=1.19",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
    "django-tailwind-cli>=4.4.2",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.4",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["config", "apps", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["apps"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
