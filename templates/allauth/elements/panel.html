{% load allauth %}
<section class="mb-6 rounded-lg border border-slate-200 bg-white p-6">
    <h2 class="mb-2 text-lg font-medium text-slate-900">
        {% slot title %}
        {% endslot %}
    </h2>
    {% slot body %}
    {% endslot %}
    {% if slots.actions %}
        <ul class="mt-4 flex gap-2">
            {% for action in slots.actions %}<li>{{ action }}</li>{% endfor %}
        </ul>
    {% endif %}
</section>
