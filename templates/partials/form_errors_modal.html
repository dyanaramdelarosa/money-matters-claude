{% if form.errors %}
    <div
        x-data="{ open: true }"
        x-show="open"
        x-cloak
        @keydown.escape.window="open = false"
        class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 px-4"
    >
        <div
            @click.outside="open = false"
            class="w-full max-w-sm rounded-lg bg-white p-6 shadow-xl"
            role="alertdialog"
            aria-modal="true"
        >
            <h2 class="mb-3 text-lg font-semibold text-slate-900">Error</h2>
            <ul class="mb-4 list-disc space-y-1 pl-5 text-sm text-red-600">
                {% for error in form.non_field_errors %}
                    <li>{{ error }}</li>
                {% endfor %}
                {% for field in form %}
                    {% for error in field.errors %}
                        <li>{{ field.label }}: {{ error }}</li>
                    {% endfor %}
                {% endfor %}
            </ul>
            <button
                @click="open = false"
                type="button"
                class="inline-flex w-full items-center justify-center rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700"
            >Close</button>
        </div>
    </div>
{% endif %}
