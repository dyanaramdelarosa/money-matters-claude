<h2 class="mb-4 text-lg font-semibold text-slate-900">Expense by Category</h2>
{% if has_data %}
    <div class="h-64">
        <canvas data-chart="chart-expense-by-category-data" id="chart-expense-by-category"></canvas>
    </div>
    {{ chart|json_script:"chart-expense-by-category-data" }}
{% else %}
    <p class="text-sm text-slate-500">No expenses in this range.</p>
{% endif %}
