{% extends "base.html" %}

{% block head_title %}Dashboard{% endblock %}

{% block extra_head %}
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script>
        function initAnalyticsCharts(root) {
            root.querySelectorAll("canvas[data-chart]").forEach(function (canvas) {
                if (canvas.chartInstance) {
                    canvas.chartInstance.destroy();
                }
                var payload = document.getElementById(canvas.dataset.chart);
                if (!payload) {
                    return;
                }
                var config = JSON.parse(payload.textContent);
                config.options = Object.assign({ responsive: true, maintainAspectRatio: false }, config.options);
                var chart = new Chart(canvas, config);
                canvas.chartInstance = chart;
                // When several cards swap back-to-back (six independent HTMX responses
                // landing close together), Chart.js can lock in its fallback 300x150
                // canvas size while its internal scale math still targets the real
                // container size — the chart then draws at full size but gets clipped
                // by the small canvas, which looks "zoomed in". A same-frame resize
                // isn't enough to fix this reliably (Chart.js's own async resize
                // handling can still overwrite it afterwards); a short delay lets that
                // settle first, then this corrective resize has the final word.
                setTimeout(function () {
                    if (canvas.chartInstance === chart) {
                        chart.resize();
                    }
                }, 50);
            });
        }
        document.addEventListener("htmx:afterSwap", function (evt) {
            initAnalyticsCharts(evt.detail.target);
        });

        function toISODate(d) {
            return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        }

        function applyAnalyticsPreset(preset) {
            var today = new Date();
            var from;
            if (preset === "month") {
                from = new Date(today.getFullYear(), today.getMonth(), 1);
            } else if (preset === "quarter") {
                var quarterStartMonth = Math.floor(today.getMonth() / 3) * 3;
                from = new Date(today.getFullYear(), quarterStartMonth, 1);
            } else {
                from = new Date(today.getFullYear(), 0, 1);
            }
            document.getElementById("id_date_from").value = toISODate(from);
            document.getElementById("id_date_to").value = toISODate(today);
            document.dispatchEvent(new Event("analytics:filter-changed"));
        }
    </script>
{% endblock extra_head %}

{% block content %}
    <div class="mb-6 flex items-center justify-between">
        <h1 class="text-2xl font-semibold text-slate-900">Dashboard</h1>
    </div>

    <form id="analytics-filters" class="mb-6 flex flex-wrap items-end gap-4 rounded-lg border border-slate-200 bg-white p-6">
        <div>
            <label for="{{ filter_form.date_from.id_for_label }}" class="block text-sm font-medium text-slate-700">From</label>
            {{ filter_form.date_from }}
        </div>
        <div>
            <label for="{{ filter_form.date_to.id_for_label }}" class="block text-sm font-medium text-slate-700">To</label>
            {{ filter_form.date_to }}
        </div>
        <div class="flex gap-2">
            <button type="button" onclick="applyAnalyticsPreset('month')" class="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50">Month</button>
            <button type="button" onclick="applyAnalyticsPreset('quarter')" class="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50">Quarter</button>
            <button type="button" onclick="applyAnalyticsPreset('year')" class="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-700 hover:bg-slate-50">Year</button>
            <button type="button" onclick="document.dispatchEvent(new Event('analytics:filter-changed'))" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500">Apply</button>
        </div>
    </form>

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
        <div id="card-expense-by-category"
             class="rounded-lg border border-slate-200 bg-white p-6"
             hx-get="{% url 'analytics:card-expense-by-category' %}"
             hx-trigger="load, analytics:filter-changed from:document"
             hx-include="#analytics-filters"
             hx-swap="innerHTML">
            <p class="text-sm text-slate-500">Loading…</p>
        </div>

        <div id="card-income-expense-trend"
             class="rounded-lg border border-slate-200 bg-white p-6"
             hx-get="{% url 'analytics:card-income-expense-trend' %}"
             hx-trigger="load, analytics:filter-changed from:document"
             hx-include="#analytics-filters"
             hx-swap="innerHTML">
            <p class="text-sm text-slate-500">Loading…</p>
        </div>

        <div id="card-net-cash-flow"
             class="rounded-lg border border-slate-200 bg-white p-6"
             hx-get="{% url 'analytics:card-net-cash-flow' %}"
             hx-trigger="load, analytics:filter-changed from:document"
             hx-include="#analytics-filters"
             hx-swap="innerHTML">
            <p class="text-sm text-slate-500">Loading…</p>
        </div>

        <div id="card-top-categories"
             class="rounded-lg border border-slate-200 bg-white p-6"
             hx-get="{% url 'analytics:card-top-categories' %}"
             hx-trigger="load, analytics:filter-changed from:document"
             hx-include="#analytics-filters"
             hx-swap="innerHTML">
            <p class="text-sm text-slate-500">Loading…</p>
        </div>

        <div id="card-account-balance-history"
             class="rounded-lg border border-slate-200 bg-white p-6"
             hx-get="{% url 'analytics:card-account-balance-history' %}"
             hx-trigger="load, analytics:filter-changed from:document"
             hx-include="#analytics-filters"
             hx-swap="innerHTML">
            <p class="text-sm text-slate-500">Loading…</p>
        </div>

        <div id="card-budget-vs-actual"
             class="rounded-lg border border-slate-200 bg-white p-6"
             hx-get="{% url 'analytics:card-budget-vs-actual' %}"
             hx-trigger="load, analytics:filter-changed from:document"
             hx-include="#analytics-filters"
             hx-swap="innerHTML">
            <p class="text-sm text-slate-500">Loading…</p>
        </div>
    </div>
{% endblock content %}
