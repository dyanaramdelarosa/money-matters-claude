{% extends "base.html" %}

{% block head_title %}Your Profile{% endblock %}

{% block content %}
    <h1 class="mb-6 text-2xl font-semibold text-slate-900">Your Profile</h1>
    <dl class="space-y-4 rounded-lg border border-slate-200 bg-white p-6">
        <div>
            <dt class="text-sm font-medium text-slate-500">Email</dt>
            <dd class="text-sm text-slate-900">{{ profile.user.email }}</dd>
        </div>
        <div>
            <dt class="text-sm font-medium text-slate-500">Base currency</dt>
            <dd class="text-sm text-slate-900">{{ profile.get_base_currency_display }} ({{ profile.base_currency }})</dd>
        </div>
    </dl>
{% endblock content %}
